{% extends 'base.html' %}{% block title %}Profile | SecureHire{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4"><h1>Your profile</h1><p class="text-muted">Keep your account details current.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" value="{{ current_user.username }}" required maxlength="80"></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" value="{{ current_user.email }}" required maxlength="255"></div><button class="btn btn-primary">Save profile</button></form></div></div></div>{% endblock %}
